<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7A5C">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conote 扫描">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>Conote 扫描仪</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column — crop editor, page grid, export card; capture buttons pinned to the bottom for rapid batch shooting. Paper-white ground, ink-green accent, highlighter-yellow handles. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#14201C; --muted:#5B6B65; --line:#D3DCD8;
  --accent:#0B7A5C; --accent-ink:#FFFFFF; --mark:#F2C14E; --danger:#B4232F; --stage:#1B2420; --bar:rgba(238,242,240,.94);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-display:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18211E; --ink:#E6EEEA; --muted:#93A39C; --line:#2A3631;
  --accent:#2FB98E; --accent-ink:#06120E; --mark:#F2C14E; --danger:#F06A73; --stage:#070B0A; --bar:rgba(15,21,19,.94); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18211E; --ink:#E6EEEA; --muted:#93A39C; --line:#2A3631;
  --accent:#2FB98E; --accent-ink:#06120E; --mark:#F2C14E; --danger:#F06A73; --stage:#070B0A; --bar:rgba(15,21,19,.94); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:400;margin-top:2px;letter-spacing:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;
  border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:focus-visible,.chip:focus-visible,.thumb:focus-visible,.mini:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:58px;font-size:17px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:22px;height:22px;flex:none}
.quick{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.quick input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:none}
.quick b{display:block;font-size:15px}.quick span{font-size:14px;color:var(--muted)}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.edhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.edhead b{font-size:15px}
.tag{font-size:12px;letter-spacing:.06em;background:var(--mark);color:#14201C;border-radius:6px;padding:2px 8px;font-weight:700}
.stage{background:var(--stage);position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:auto;max-width:100%}
#loupe{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid var(--mark);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.4);top:8px}
.hint{font-size:14px;color:var(--muted);padding:8px 14px 0;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preview{padding:0 14px 14px}
.preview canvas{width:100%;max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sechead h2{font-size:15px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.04em}
.sechead h2 b{font-family:var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--danger);font:inherit;font-size:14px;cursor:pointer;padding:6px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.empty{color:var(--muted);font-size:15px;padding:14px;border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
.page{display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:0}
.thumb{position:relative;aspect-ratio:3/4;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb.check{border:2px solid var(--mark)}
.thumb img{max-width:100%;max-height:100%}
.badge{position:absolute;left:4px;top:4px;background:var(--mark);color:#14201C;font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:2px}
.pnum{font-family:var(--f-display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pact{display:flex;gap:2px}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;width:26px;height:26px;font:inherit;font-size:13px;cursor:pointer;padding:0;line-height:1}
.mini.del{color:var(--danger)}
.export{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.export h2{font-size:15px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.04em}
label.f{font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.fnrow{display:flex;align-items:center;gap:6px}.fnrow span{color:var(--muted);flex:none}
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fmt .chip{border-radius:10px;min-height:48px;text-align:left;padding:8px 12px}
.fmt .chip small{display:block;font-size:12px;opacity:.75}
.outnote{font-size:14px;color:var(--muted);margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn:only-child{grid-column:1/-1}
.capbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.capbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:calc(100% - 32px);z-index:20;text-align:center}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:30;color:#fff;font-size:17px}
.bar{width:min(260px,70vw);height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mark)}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,transform .1s}.btn:active{transform:scale(.98)}.bar i{transition:width .2s}}
</style>

<div class="wrap">
  <header>
    <h1>Conote 扫描仪<small>拍照 · 裁边 · 变白 · PDF / JPEG</small></h1>
  </header>

  <label class="quick" for="quick">
    <input type="checkbox" id="quick" checked>
    <div><b>快速模式</b><span>拍完自动找边、变白、直接加入，不用逐张确认。黄框的页面请点开检查。</span></div>
  </label>

  <div class="editor" id="editor">
    <div class="edhead"><b id="edTitle">调整边角</b><span class="tag" id="edTag">示例</span></div>
    <p class="hint">拖动四个黄点对准单据四角，按住时会放大给你看。</p>
    <div class="stage" id="stage"><canvas id="cv"></canvas><canvas id="loupe" width="220" height="220" hidden></canvas></div>
    <div class="tools">
      <button class="btn" id="btnRot" type="button">↻ 旋转</button>
      <button class="btn" id="btnFull" type="button">全图</button>
      <button class="btn" id="btnAuto" type="button">自动找边</button>
    </div>
    <div class="chips" role="group" aria-label="滤镜">
      <button class="chip" data-f="enhance" aria-pressed="true" type="button">增强（变白）</button>
      <button class="chip" data-f="bw" aria-pressed="false" type="button">黑白</button>
      <button class="chip" data-f="gray" aria-pressed="false" type="button">灰度</button>
      <button class="chip" data-f="none" aria-pressed="false" type="button">原图</button>
    </div>
    <div class="preview"><canvas id="out"></canvas></div>
    <div class="row">
      <button class="btn" id="btnDiscard" type="button">放弃</button>
      <button class="btn primary" id="btnSave" type="button">✓ 加入文件</button>
    </div>
  </div>

  <section>
    <div class="sechead"><h2>已扫描 <b id="count">0</b> 页</h2><button class="linkbtn" id="btnClear" type="button" hidden>清空全部</button></div>
    <div class="grid" id="grid"><div class="empty">还没有页面。点下面“拍照”开始扫描。</div></div>
  </section>

  <div class="export" id="export">
    <h2>导出</h2>
    <div><label class="f" for="fname">文件名</label>
      <div class="fnrow"><input type="text" id="fname" autocomplete="off"><span id="ext">.pdf</span></div></div>
    <div class="fmt" role="group" aria-label="格式">
      <button class="chip" data-fmt="pdf" aria-pressed="true" type="button">PDF<small>全部合成一个文件</small></button>
      <button class="chip" data-fmt="jpg" aria-pressed="false" type="button">JPEG<small>每页一张图片</small></button>
    </div>
    <p class="outnote" id="outnote">0 页 → 1 个 PDF</p>
    <div class="actions">
      <button class="btn primary big" id="btnShare" type="button" disabled hidden>分享 / WhatsApp</button>
      <button class="btn big" id="btnSaveOut" type="button" disabled>保存到手机</button>
    </div>
  </div>
</div>

<div class="capbar"><div class="in">
  <button class="btn primary big" id="btnCam" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照</button>
  <button class="btn big" id="btnPick" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>相册</button>
  <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="filePick" accept="image/*" multiple hidden>
</div></div>
<div id="toast" hidden></div>
<div class="busy" id="busy" hidden><span id="busyText">处理中…</span><div class="bar"><i id="busyBar"></i></div></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), out = $('out'), loupe = $('loupe');
const MAXSRC = 2400, MAXOUT = 2000, JPGQ = 0.85;
let src = null, quad = null, filter = 'enhance', editingIndex = -1, isSample = false, srcBlob = null;
let pages = [];      // {id, src:Blob, quad, filter, out:Blob, w, h, thumb, check}
let queue = [];
let fmt = 'pdf';
const inClaude = !!(window.claude && window.claude.use);
let downloads = null;

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function busy(on,text,frac){$('busy').hidden=!on; if(text)$('busyText').textContent=text; $('busyBar').style.width=((frac||0)*100)+'%'; $('busyBar').parentNode.hidden=frac==null;}
const tick = () => new Promise(r=>setTimeout(r,20));
const pad = n => String(n).padStart(2,'0');
const d = new Date(); $('fname').value = `conote_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
try{ const q=localStorage.getItem('quick'); if(q!==null) $('quick').checked = q==='1'; }catch(e){}
$('quick').onchange = () => { try{localStorage.setItem('quick',$('quick').checked?'1':'0')}catch(e){} };

/* ---------- storage (IndexedDB): pages survive closing the app ---------- */
let idb=null;
function openDb(){ return new Promise(res=>{ try{ const r=indexedDB.open('conote-scan',1);
  r.onupgradeneeded=()=>{const db=r.result; db.createObjectStore('pages',{keyPath:'id'}); db.createObjectStore('meta');};
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){res(null)} }); }
function tx(store,mode,fn){ return new Promise(res=>{ if(!idb) return res(null); try{ const t=idb.transaction(store,mode); const s=t.objectStore(store); const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>res(null);}catch(e){res(null)} }); }
const dbPut = p => tx('pages','readwrite',s=>s.put(p));
const dbDel = id => tx('pages','readwrite',s=>s.delete(id));
const dbOrder = () => tx('meta','readwrite',s=>s.put(pages.map(p=>p.id),'order'));
async function dbLoad(){ if(!idb) return [];
  const order = await tx('meta','readonly',s=>s.get('order')) || [];
  const all = await tx('pages','readonly',s=>s.getAll()) || [];
  const map = new Map(all.map(p=>[p.id,p])); return order.map(id=>map.get(id)).filter(Boolean); }

/* ---------- image helpers ---------- */
function canvasFrom(img,w,h){ const s=Math.min(1,MAXSRC/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c; }
function loadFile(file){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const c=canvasFrom(img,img.naturalWidth,img.naturalHeight); URL.revokeObjectURL(url); res(c); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); }; img.src=url; });
}
async function blobToCanvas(b){ const bmp=await createImageBitmap(b); const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height; c.getContext('2d').drawImage(bmp,0,0); bmp.close&&bmp.close(); return c; }
const toBlob = (c,q=JPGQ) => new Promise(r=>c.toBlob(r,'image/jpeg',q));
function makeThumb(c){const t=document.createElement('canvas'),s=240/Math.max(c.width,c.height);t.width=Math.round(c.width*s);t.height=Math.round(c.height*s);t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)}
async function finish(srcC, sBlob, q, f, check, id){
  const r = applyFilter(warp(srcC,q), f);
  return { id: id||uid(), src: sBlob || await toBlob(srcC,0.9), quad:q.map(p=>({...p})), filter:f, out: await toBlob(r), w:r.width, h:r.height, thumb:makeThumb(r), check:!!check };
}

/* ---------- capture ---------- */
$('btnCam').onclick = () => $('fileCam').click();
$('btnPick').onclick = () => $('filePick').click();
$('fileCam').onchange = e => { handleFiles(e.target.files); e.target.value=''; };
$('filePick').onchange = e => { handleFiles(e.target.files); e.target.value=''; };
async function handleFiles(list){
  const files = Array.from(list||[]); if(!files.length) return;
  if($('quick').checked){ await batch(files); return; }
  queue = files; await nextInQueue();
}
async function batch(files){
  let ok=0, bad=0, chk=0;
  for(let i=0;i<files.length;i++){
    busy(true, files.length>1?`处理中 ${i+1} / ${files.length}`:'处理中…', files.length>1?i/files.length:null); await tick();
    try{ const c=await loadFile(files[i]); const q=autoDetect(c); const p=await finish(c,null,q||insetQuad(c),'enhance',!q);
      pages.push(p); await dbPut(p); ok++; if(!q) chk++; }
    catch(e){ bad++; }
  }
  await dbOrder(); busy(false); renderGrid(); closeEditor();
  let msg = `已加入 ${ok} 页，共 ${pages.length} 页`; if(chk) msg += `｜${chk} 页没找到纸边，请点黄框检查`; if(bad) msg += `｜${bad} 张打不开`;
  toast(msg);
}
async function nextInQueue(){
  const f = queue.shift(); if(!f) return false;
  try{ busy(true,'处理中…'); await tick(); const c = await loadFile(f); startEdit(c, null, null, 'enhance', -1, false); }
  catch(e){ toast('这张图片打不开，换一张试试'); }
  finally{ busy(false); }
  return true;
}

/* ---------- editor ---------- */
function startEdit(c, blob, q, f, idx, sample){
  src = c; srcBlob = blob; quad = q ? q.map(p=>({...p})) : autoDetect(c) || insetQuad(c); filter = f; editingIndex = idx; isSample = !!sample;
  $('editor').hidden = false; $('edTag').hidden = !isSample;
  $('edTitle').textContent = idx>=0 ? `修改第 ${idx+1} 页` : (queue.length ? `调整边角（还有 ${queue.length} 张）` : '调整边角');
  $('btnSave').textContent = idx>=0 ? '✓ 保存修改' : '✓ 加入文件';
  document.querySelectorAll('.chips .chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.f===filter));
  cv.width = src.width; cv.height = src.height; draw(); schedulePreview();
}
function insetQuad(c){const w=c.width,h=c.height,m=0.04;return[{x:w*m,y:h*m},{x:w*(1-m),y:h*m},{x:w*(1-m),y:h*(1-m)},{x:w*m,y:h*(1-m)}]}
function fullQuad(c){const w=c.width,h=c.height;return[{x:0,y:0},{x:w,y:0},{x:w,y:h},{x:0,y:h}]}
function handleR(){ return Math.max(14, cv.width / (cv.clientWidth||cv.width) * 14); }
let drag = -1;
function draw(){
  ctx.drawImage(src,0,0);
  const r = handleR(), lw = Math.max(2, r/5);
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.rect(0,0,cv.width,cv.height);
  ctx.moveTo(quad[0].x,quad[0].y); for(let i=3;i>=1;i--) ctx.lineTo(quad[i].x,quad[i].y); ctx.closePath(); ctx.fill('evenodd');
  ctx.strokeStyle='#F2C14E'; ctx.lineWidth=lw; ctx.beginPath(); quad.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.stroke();
  quad.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fillStyle = i===drag?'#FFFFFF':'#F2C14E'; ctx.fill(); ctx.lineWidth=lw; ctx.strokeStyle='#14201C'; ctx.stroke(); });
  ctx.restore();
}
function evPt(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}}
cv.addEventListener('pointerdown', e=>{
  const p = evPt(e), R = handleR()*2.6; let best=-1,bd=1e9;
  quad.forEach((q,i)=>{const dd=Math.hypot(q.x-p.x,q.y-p.y); if(dd<bd){bd=dd;best=i}});
  if(bd<R){ drag=best; cv.setPointerCapture(e.pointerId); showLoupe(); draw(); e.preventDefault(); }
});
cv.addEventListener('pointermove', e=>{ if(drag<0) return; const p=evPt(e);
  quad[drag] = {x:Math.max(0,Math.min(cv.width,p.x)), y:Math.max(0,Math.min(cv.height,p.y))}; draw(); showLoupe(); e.preventDefault(); });
const endDrag = ()=>{ if(drag<0) return; drag=-1; loupe.hidden=true; draw(); schedulePreview(); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
function showLoupe(){

/* ---------- auto detect: bright paper region vs background ---------- */
function autoDetect(c){
  const W=160, s=W/Math.max(c.width,c.height), w=Math.max(8,Math.round(c.width*s)), h=Math.max(8,Math.round(c.height*s));
  const t=document.createElement('canvas'); t.width=w; t.height=h; const tc=t.getContext('2d'); tc.drawImage(c,0,0,w,h);
  const d=tc.getImageData(0,0,w,h).data, L=new Float32Array(w*h), hist=new Array(256).fill(0);
  for(let i=0;i<w*h;i++){const v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];L[i]=v;hist[v|0]++}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i]; let sB=0,wB=0,best=0,th=128;
  for(let i=0;i<256;i++){wB+=hist[i]; if(!wB)continue; const wF=w*h-wB; if(!wF)break; sB+=i*hist[i];
    const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2; if(v>best){best=v;th=i}}
  const lab=new Uint8Array(w*h); let bestC=null,bestN=0;
  for(let i=0;i<w*h;i++){ if(L[i]<=th||lab[i]) continue; const st=[i]; lab[i]=1; const pts=[];
    while(st.length){const k=st.pop(); pts.push(k); const x=k%w,y=(k/w)|0;
      if(x+1<w&&!lab[k+1]&&L[k+1]>th){lab[k+1]=1;st.push(k+1)} if(x>0&&!lab[k-1]&&L[k-1]>th){lab[k-1]=1;st.push(k-1)}
      if(y+1<h&&!lab[k+w]&&L[k+w]>th){lab[k+w]=1;st.push(k+w)} if(y>0&&!lab[k-w]&&L[k-w]>th){lab[k-w]=1;st.push(k-w)}}
    if(pts.length>bestN){bestN=pts.length;bestC=pts} }
  if(!bestC || bestN < w*h*0.12 || bestN > w*h*0.97) return null;
  let tl,tr,br,bl,a=1e9,b=-1e9,cc=-1e9,dd=1e9;
  for(const k of bestC){const x=k%w,y=(k/w)|0; if(x+y<a){a=x+y;tl={x,y}} if(x+y>b){b=x+y;br={x,y}} if(x-y>cc){cc=x-y;tr={x,y}} if(x-y<dd){dd=x-y;bl={x,y}}}
  return [tl,tr,br,bl].map(p=>({x:Math.min(c.width,(p.x+0.5)/s), y:Math.min(c.height,(p.y+0.5)/s)}));
}

/* ---------- perspective warp ---------- */
function squareToQuad(q){
  const [p0,p1,p2,p3]=q, x0=p0.x,y0=p0.y,x1=p1.x,y1=p1.y,x2=p2.x,y2=p2.y,x3=p3.x,y3=p3.y;
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  let g=0,h=0; if(Math.abs(dx3)>1e-9||Math.abs(dy3)>1e-9){const den=dx1*dy2-dx2*dy1; g=(dx3*dy2-dx2*dy3)/den; h=(dx1*dy3-dx3*dy1)/den;}
  return {a:x1-x0+g*x1,b:x3-x0+h*x3,c:x0,d:y1-y0+g*y1,e:y3-y0+h*y3,f:y0,g,h};
}
function warp(srcC, q){
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  let W=(dist(q[0],q[1])+dist(q[3],q[2]))/2, H=(dist(q[0],q[3])+dist(q[1],q[2]))/2;
  const s=Math.min(1,MAXOUT/Math.max(W,H)); W=Math.max(1,Math.round(W*s)); H=Math.max(1,Math.round(H*s));
  const m=squareToQuad(q), sw=srcC.width, sh=srcC.height;
  const sd=srcC.getContext('2d').getImageData(0,0,sw,sh).data;
  const o=document.createElement('canvas'); o.width=W; o.height=H; const oc=o.getContext('2d'); const od=oc.createImageData(W,H); const D=od.data;
  for(let y=0;y<H;y++){const v=(y+0.5)/H;
    for(let x=0;x<W;x++){const u=(x+0.5)/W, z=m.g*u+m.h*v+1;
      let sx=(m.a*u+m.b*v+m.c)/z-0.5, sy=(m.d*u+m.e*v+m.f)/z-0.5;
      if(sx<0)sx=0; if(sy<0)sy=0; if(sx>sw-1.001)sx=sw-1.001; if(sy>sh-1.001)sy=sh-1.001;
      const ix=sx|0, iy=sy|0, fx=sx-ix, fy=sy-iy, i0=(iy*sw+ix)*4, i1=i0+4, i2=i0+sw*4, i3=i2+4, k=(y*W+x)*4;
      for(let ch=0;ch<3;ch++){D[k+ch]=(sd[i0+ch]*(1-fx)+sd[i1+ch]*fx)*(1-fy)+(sd[i2+ch]*(1-fx)+sd[i3+ch]*fx)*fy}
      D[k+3]=255;}}
  oc.putImageData(od,0,0); return o;
}

/* ---------- filters ---------- */
function applyFilter(c, f){
  if(f==='none') return c;
  const W=c.width,H=c.height, cx=c.getContext('2d'), img=cx.getImageData(0,0,W,H), d=img.data;
  if(f==='gray'){for(let i=0;i<d.length;i+=4){const v=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];d[i]=d[i+1]=d[i+2]=v} cx.putImageData(img,0,0); return c;}
  const bw=Math.max(4,Math.round(W/24)), bh=Math.max(4,Math.round(H/24));
  const sm=document.createElement('canvas'); sm.width=bw; sm.height=bh; const sc=sm.getContext('2d'); sc.imageSmoothingQuality='high'; sc.drawImage(c,0,0,bw,bh);
  let sdat=sc.getImageData(0,0,bw,bh);
  for(let pass=0;pass<2;pass++){const a=sdat.data, b=new Uint8ClampedArray(a);
    for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){let r=0,g=0,bl=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=Math.min(bw-1,Math.max(0,x+dx)),yy=Math.min(bh-1,Math.max(0,y+dy)),k=(yy*bw+xx)*4; if(a[k]>r)r=a[k]; if(a[k+1]>g)g=a[k+1]; if(a[k+2]>bl)bl=a[k+2];}
      const k=(y*bw+x)*4; b[k]=r;b[k+1]=g;b[k+2]=bl;}
    sdat=new ImageData(b,bw,bh);}
  sc.putImageData(sdat,0,0);
  const big=document.createElement('canvas'); big.width=W; big.height=H; const bc=big.getContext('2d'); bc.imageSmoothingQuality='high'; bc.drawImage(sm,0,0,W,H);
  const bg=bc.getImageData(0,0,W,H).data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i]*255/Math.max(40,bg[i]), g=d[i+1]*255/Math.max(40,bg[i+1]), b=d[i+2]*255/Math.max(40,bg[i+2]);
    r=255-(255-r)*1.45; g=255-(255-g)*1.45; b=255-(255-b)*1.45;
    if(f==='bw'){const v=0.299*r+0.587*g+0.114*b; const o=v>200?255:v<150?0:(v-150)*5.1; d[i]=d[i+1]=d[i+2]=o;}
    else{d[i]=r;d[i+1]=g;d[i+2]=b;}
  }
  cx.putImageData(img,0,0); return c;
}

function buildPdf(imgs){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x; parts.push(b); len+=b.length;};
  const obj=(id,...body)=>{offs[id]=len; push(`${id} 0 obj\n`); body.forEach(push); push('\nendobj\n');};
  const n=imgs.length, total=2+3*n, PW=595.28;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${n} >>`);
  imgs.forEach((im,i)=>{
    const pid=3+i*3, PH=(PW*im.h/im.w).toFixed(2), s=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${pid+2} 0 R >> >> /Contents ${pid+1} 0 R >>`);
    obj(pid+1,`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);
    obj(pid+2,`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,'\nendstream');
  });
  const x=len; let xr=`xref\n0 ${total+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=total;i++) xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(xr+`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function buildZip(files){ // stored (no compression), JPEGs are already compressed
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  for(const f of files){ const nm=enc.encode(f.name), crc=crc32(f.bytes), sz=f.bytes.length;
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,f.bytes);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm); off+=30+nm.length+sz; }
  const cs=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});
}
async function makePdf(){
  const imgs=[]; for(let i=0;i<pages.length;i++){ busy(true,`生成 PDF ${i+1} / ${pages.length}`,i/pages.length); await tick();
    const p=pages[i]; imgs.push({bytes:new Uint8Array(await p.out.arrayBuffer()),w:p.w,h:p.h}); }
  return new File([buildPdf(imgs)], baseName()+'.pdf', {type:'application/pdf'});
}

  x.strokeStyle='#1d2a4a';x.lineWidth=2;
  const rows=[['Shipper','SAMPLE TRADING'],['Consignee','DEMO HARDWARE'],['Destination','TWU'],['HAWB','HW-20931'],['Description','3 CTN SPARE PARTS'],['Weight','42 KG']];
  rows.forEach((r,i)=>{const y=200+i*90;x.strokeRect(60,y,680,90);x.beginPath();x.moveTo(260,y);x.lineTo(260,y+90);x.stroke();x.font='24px sans-serif';x.fillText(r[0],75,y+55);x.fillStyle='#1f3fa8';x.font='italic 30px serif';x.fillText(r[1],285,y+57);x.fillStyle='#1d2a4a';});
  x.font='22px sans-serif';x.fillText('Received in good order and condition',60,850);x.beginPath();x.moveTo(60,980);x.lineTo(360,980);x.stroke();x.fillText('Signature',60,1010);
  x.strokeStyle='#1f3fa8';x.lineWidth=3;x.beginPath();x.moveTo(80,960);x.bezierCurveTo(130,900,170,1000,220,940);x.bezierCurveTo(250,910,280,970,330,930);x.stroke();
  x.restore();
  const sh=x.createRadialGradient(950,1300,50,950,1300,900);sh.addColorStop(0,'rgba(0,0,0,.45)');sh.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=sh;x.fillRect(0,0,W,H);
  const lt=x.createRadialGradient(300,300,20,300,300,700);lt.addColorStop(0,'rgba(255,240,200,.18)');lt.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=lt;x.fillRect(0,0,W,H);
  return {c,q};
}
