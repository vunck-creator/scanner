<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7A5C">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="文件扫描">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>文件扫描仪</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column — crop editor, page grid, export card; capture buttons pinned to the bottom for rapid batch shooting. Paper-white ground, ink-green accent, highlighter-yellow handles. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#14201C; --muted:#5B6B65; --line:#D3DCD8;
  --accent:#0B7A5C; --accent-ink:#FFFFFF; --mark:#F2C14E; --danger:#B4232F; --stage:#1B2420; --bar:rgba(238,242,240,.94);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-display:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18211E; --ink:#E6EEEA; --muted:#93A39C; --line:#2A3631;
  --accent:#2FB98E; --accent-ink:#06120E; --mark:#F2C14E; --danger:#F06A73; --stage:#070B0A; --bar:rgba(15,21,19,.94); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18211E; --ink:#E6EEEA; --muted:#93A39C; --line:#2A3631;
  --accent:#2FB98E; --accent-ink:#06120E; --mark:#F2C14E; --danger:#F06A73; --stage:#070B0A; --bar:rgba(15,21,19,.94); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:400;margin-top:2px;letter-spacing:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;
  border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:focus-visible,.chip:focus-visible,.thumb:focus-visible,.mini:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:58px;font-size:17px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:22px;height:22px;flex:none}
.quick{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.quick input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:none}
.ver{font-family:var(--f-display);color:var(--accent);font-weight:500}
.quick b{display:block;font-size:15px}.quick span{font-size:14px;color:var(--muted)}
.editor{position:fixed;inset:0;z-index:50;background:var(--surface);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.editor .edin{max-width:640px;margin:0 auto}
.editor .row{position:sticky;bottom:0;background:var(--surface);padding-top:10px;border-top:1px solid var(--line)}
/* full-screen viewer: swipe through finished pages */
.viewer{position:fixed;inset:0;z-index:45;background:#111;color:#fff;display:flex;flex-direction:column}
.vtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.vtop b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.vwarn{font-size:13px;background:var(--danger);color:#fff;border-radius:999px;padding:3px 10px}
.vtrack{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.vtrack::-webkit-scrollbar{display:none}
.vpage{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:6px 10px}
.vpage img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.5)}
.vbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.vbar .btn{background:#222;border-color:#333;color:#fff;flex-direction:column;gap:2px;font-size:14px;min-height:56px}
.vbar .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vbar .btn.danger{color:#F06A73}
.camtools{display:flex;gap:8px;align-items:center}
.camchip{appearance:none;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.55);color:#fff;border-radius:999px;height:40px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.camchip[aria-pressed="true"]{background:var(--mark);color:#14201C;border-color:var(--mark)}
.focus{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid var(--mark);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .4s}
.edhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.edhead b{font-size:15px}
.tag{font-size:12px;letter-spacing:.06em;background:var(--mark);color:#14201C;border-radius:6px;padding:2px 8px;font-weight:700}
.stage{background:var(--stage);position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:auto;max-width:100%}
#loupe{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid var(--mark);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.4);top:8px}
.hint{font-size:14px;color:var(--muted);padding:8px 14px 0;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preview{padding:0 14px 14px}
.preview canvas{width:100%;max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sechead h2{font-size:15px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.04em}
.sechead h2 b{font-family:var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--danger);font:inherit;font-size:14px;cursor:pointer;padding:6px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.empty{color:var(--muted);font-size:15px;padding:14px;border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
.page{display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:0}
.thumb{position:relative;aspect-ratio:3/4;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb img{max-width:100%;max-height:100%}
.badge{position:absolute;left:4px;top:4px;background:var(--mark);color:#14201C;font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:2px}
.pnum{font-family:var(--f-display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pact{display:flex;gap:2px}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;width:26px;height:26px;font:inherit;font-size:13px;cursor:pointer;padding:0;line-height:1}
.mini.del{color:var(--danger)}
.export{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.export h2{font-size:15px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.04em}
label.f{font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.fnrow{display:flex;align-items:center;gap:6px}.fnrow span{color:var(--muted);flex:none}
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fmt .chip{border-radius:10px;min-height:48px;text-align:left;padding:8px 12px}
.fmt .chip small{display:block;font-size:12px;opacity:.75}
.outnote{font-size:14px;color:var(--muted);margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn:only-child{grid-column:1/-1}
.capbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.capbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:calc(100% - 32px);z-index:60;text-align:center}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:70;color:#fff;font-size:17px}
.bar{width:min(260px,70vw);height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mark)}
/* in-app camera: shoot many pages in a row, no confirm step */
.cam{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;color:#fff}
.camview{position:relative;flex:1;min-height:0;overflow:hidden}
.camview video,.camview canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.camtop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.camhint{background:rgba(0,0,0,.55);border-radius:999px;padding:6px 14px;font-size:14px}
.camx{appearance:none;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer}
.cambar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));background:#000}
.shutter{appearance:none;width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}
.shutter:active{transform:scale(.93)}.shutter:disabled{opacity:.5}
.camthumb{justify-self:start;position:relative;width:56px;height:72px;border-radius:8px;border:2px solid #fff;background:#222;padding:0;overflow:hidden;cursor:pointer}
.camthumb img{width:100%;height:100%;object-fit:cover;display:block}
.camthumb b{position:absolute;right:-2px;top:-2px;background:var(--mark);color:#14201C;font-size:13px;border-radius:999px;min-width:24px;padding:0 6px;font-family:var(--f-display)}
.camdone{justify-self:end;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .25s ease-out}@keyframes fl{from{opacity:.75}to{opacity:0}}
.dot{position:absolute;right:5px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px #fff}
.thumb.check{border:2px solid var(--danger)}
.conf{font-size:12px;color:var(--muted)}
.proc{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,transform .1s}.btn:active{transform:scale(.98)}.bar i{transition:width .2s}}
</style>

<div class="wrap">
  <header>
    <h1>文件扫描仪<small>拍照 · 裁边 · 变白 · PDF / JPEG · <span class="ver">v7 · 2026-11-14</span></small></h1>
  </header>

  <label class="quick" for="quick">
    <input type="checkbox" id="quick" checked>
    <div><b>快速模式（相册）</b><span>相册多选也自动找边、变白、直接加入。带红点的是没把握的，点开看看，不对再按“编辑”。</span></div>
  </label>

  <div class="editor" id="editor" hidden><div class="edin">
    <div class="edhead"><b id="edTitle">调整边角</b><span class="conf" id="edConf"></span><span class="tag" id="edTag">示例</span></div>
    <p class="hint">拖动四个黄点对准单据四角，按住时会放大给你看。</p>
    <div class="stage" id="stage"><canvas id="cv"></canvas><canvas id="loupe" width="220" height="220" hidden></canvas></div>
    <div class="tools">
      <button class="btn" id="btnRot" type="button">↻ 旋转</button>
      <button class="btn" id="btnFull" type="button">全图</button>
      <button class="btn" id="btnAuto" type="button">自动找边</button>
    </div>
    <div class="chips" role="group" aria-label="滤镜">
      <button class="chip" data-f="enhance" aria-pressed="true" type="button">增强（变白）</button>
      <button class="chip" data-f="bw" aria-pressed="false" type="button">黑白</button>
      <button class="chip" data-f="gray" aria-pressed="false" type="button">灰度</button>
      <button class="chip" data-f="none" aria-pressed="false" type="button">原图</button>
    </div>
    <div class="preview"><canvas id="out"></canvas></div>
    <div class="row">
      <button class="btn" id="btnDiscard" type="button">取消</button>
      <button class="btn primary" id="btnSave" type="button">✓ 加入文件</button>
    </div>
  </div></div>

  <section>
    <div class="sechead"><h2>已扫描 <b id="count">0</b> 页 <span class="proc" id="proc"></span></h2><button class="linkbtn" id="btnClear" type="button" hidden>清空全部</button></div>
    <div class="grid" id="grid"><div class="empty">还没有页面。点下面“拍照”开始扫描。</div></div>
  </section>

  <div class="export" id="export">
    <h2>导出</h2>
    <div><label class="f" for="fname">文件名</label>
      <div class="fnrow"><input type="text" id="fname" autocomplete="off"><span id="ext">.pdf</span></div></div>
    <div class="fmt" role="group" aria-label="格式">
      <button class="chip" data-fmt="pdf" aria-pressed="true" type="button">PDF<small>全部合成一个文件</small></button>
      <button class="chip" data-fmt="jpg" aria-pressed="false" type="button">JPEG<small>每页一张图片</small></button>
    </div>
    <p class="outnote" id="outnote">0 页 → 1 个 PDF</p>
    <div class="actions">
      <button class="btn primary big" id="btnShare" type="button" disabled hidden>分享 / WhatsApp</button>
      <button class="btn big" id="btnSaveOut" type="button" disabled>保存到手机</button>
    </div>
  </div>
</div>

<div class="capbar"><div class="in">
  <button class="btn primary big" id="btnCam" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照</button>
  <button class="btn big" id="btnPick" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>相册</button>
  <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="filePick" accept="image/*" multiple hidden>
</div></div>
<div class="cam" id="cam" hidden>
  <div class="camview"><video id="vid" playsinline muted autoplay></video><canvas id="camOv"></canvas><div class="flash" id="flash"></div>
    <div class="focus" id="focusRing"></div>
    <div class="camtop"><span class="camhint" id="camHint">对准文件，按快门</span><div class="camtools"><button class="camchip" id="camLens" type="button" hidden>换镜头</button><button class="camchip" id="camHQ" type="button" aria-pressed="false">高清</button><button class="camx" id="camClose" type="button" aria-label="关闭相机">✕</button></div></div></div>
  <div class="cambar">
    <button class="camthumb" id="camThumb" type="button" aria-label="完成并查看"><img id="camLast" alt="" hidden><b id="camN">0</b></button>
    <button class="shutter" id="shutter" type="button" aria-label="拍照"></button>
    <button class="btn camdone" id="camDone" type="button">完成</button>
  </div>
</div>
<div class="viewer" id="viewer" hidden>
  <div class="vtop"><b id="vPos">1 / 1</b><span class="vwarn" id="vWarn" hidden>找边没把握，看一下</span><button class="camx" id="vClose" type="button" aria-label="返回">✕</button></div>
  <div class="vtrack" id="vTrack"></div>
  <div class="vbar">
    <button class="btn primary" id="vEdit" type="button">✎<span>编辑</span></button>
    <button class="btn" id="vRot" type="button">↻<span>旋转</span></button>
    <button class="btn danger" id="vDel" type="button">✕<span>删除</span></button>
    <button class="btn" id="vBack" type="button">▦<span>返回</span></button>
  </div>
</div>
<div id="toast" hidden></div>
<div class="busy" id="busy" hidden><span id="busyText">处理中…</span><div class="bar"><i id="busyBar"></i></div></div>

<script src="scan-core.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), out = $('out'), loupe = $('loupe');
const MAXSRC = 2400, MAXOUT = 2000, JPGQ = 0.85;
let src = null, quad = null, filter = 'enhance', editingIndex = -1, isSample = false, srcBlob = null;
let pages = [];      // {id, src:Blob, quad, filter, out:Blob, w, h, thumb, check, conf}
const CONF_OK = 60;  // below this the page gets a red dot
let srcConf = null;
/* ---------- OpenCV core (loads in the background; old pure-JS code is the fallback) ---------- */
let coreOk = false;
const coreP = (window.ScanCore ? ScanCore.load('opencv.js') : Promise.reject()).then(()=>{coreOk=true}).catch(()=>{});
async function core(){ if(coreOk) return true; await Promise.race([coreP, new Promise(r=>setTimeout(r,30000))]); return coreOk; }
function detectQ(c){
  if(coreOk){ const r=ScanCore.detect(c); return r&&r.quad ? r : {quad:null,conf:0}; }
  const q=autoDetect(c); return {quad:q, conf:q?50:0};
}
function render(c,q,f,max){ return coreOk ? ScanCore.filter(ScanCore.warp(c,q,max),f) : applyFilter(warp(c,q),f); }
const encodeOut = c => coreOk ? ScanCore.encode(c) : toBlob(c);
let queue = [];
let fmt = 'pdf';
const inClaude = !!(window.claude && window.claude.use);
let downloads = null;

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function busy(on,text,frac){$('busy').hidden=!on; if(text)$('busyText').textContent=text; $('busyBar').style.width=((frac||0)*100)+'%'; $('busyBar').parentNode.hidden=frac==null;}
const tick = () => new Promise(r=>setTimeout(r,20));
const pad = n => String(n).padStart(2,'0');
const stamp = (d=new Date()) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
let nameEdited = false; $('fname').value = stamp();
function autoName(){ if(!nameEdited){ $('fname').value = stamp(); updateExport(); } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
try{ const q=localStorage.getItem('quick'); if(q!==null) $('quick').checked = q==='1'; }catch(e){}
$('quick').onchange = () => { try{localStorage.setItem('quick',$('quick').checked?'1':'0')}catch(e){} };

/* ---------- storage (IndexedDB): pages survive closing the app ---------- */
let idb=null;
function openDb(){ return new Promise(res=>{ try{ const r=indexedDB.open('conote-scan',1);
  r.onupgradeneeded=()=>{const db=r.result; db.createObjectStore('pages',{keyPath:'id'}); db.createObjectStore('meta');};
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){res(null)} }); }
function tx(store,mode,fn){ return new Promise(res=>{ if(!idb) return res(null); try{ const t=idb.transaction(store,mode); const s=t.objectStore(store); const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>res(null);}catch(e){res(null)} }); }
const dbPut = p => tx('pages','readwrite',s=>s.put(p));
const dbDel = id => tx('pages','readwrite',s=>s.delete(id));
const dbOrder = () => tx('meta','readwrite',s=>s.put(pages.map(p=>p.id),'order'));
async function dbLoad(){ if(!idb) return [];
  const order = await tx('meta','readonly',s=>s.get('order')) || [];
  const all = await tx('pages','readonly',s=>s.getAll()) || [];
  const map = new Map(all.map(p=>[p.id,p])); return order.map(id=>map.get(id)).filter(Boolean); }

/* ---------- image helpers ---------- */
function canvasFrom(img,w,h){ const s=Math.min(1,MAXSRC/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c; }
function loadFile(file){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const c=canvasFrom(img,img.naturalWidth,img.naturalHeight); URL.revokeObjectURL(url); res(c); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); }; img.src=url; });
}
async function blobToCanvas(b){ const bmp=await createImageBitmap(b); const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height; c.getContext('2d').drawImage(bmp,0,0); bmp.close&&bmp.close(); return c; }
const toBlob = (c,q=JPGQ) => new Promise(r=>c.toBlob(r,'image/jpeg',q));
function makeThumb(c){const t=document.createElement('canvas'),s=240/Math.max(c.width,c.height);t.width=Math.round(c.width*s);t.height=Math.round(c.height*s);t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)}
async function finish(srcC, sBlob, q, f, check, id, conf){
  const r = render(srcC, q, f);
  return { id: id||uid(), src: sBlob || await toBlob(srcC,0.9), quad:q.map(p=>({...p})), filter:f, out: await encodeOut(r), w:r.width, h:r.height, thumb:makeThumb(r), check:!!check, conf: conf==null?null:conf };
}

/* ---------- capture ---------- */
$('btnCam').onclick = () => (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? openCam() : $('fileCam').click();
$('btnPick').onclick = () => $('filePick').click();
$('fileCam').onchange = e => { handleFiles(e.target.files); e.target.value=''; };
$('filePick').onchange = e => { handleFiles(e.target.files); e.target.value=''; };
async function handleFiles(list){
  const files = Array.from(list||[]); if(!files.length) return;
  if($('quick').checked){ await batch(files); return; }
  queue = files; await nextInQueue();
}
async function batch(files){
  let ok=0, bad=0, chk=0;
  busy(true,'准备中…'); await core();
  for(let i=0;i<files.length;i++){
    busy(true, files.length>1?`处理中 ${i+1} / ${files.length}`:'处理中…', files.length>1?i/files.length:null); await tick();
    try{ const c=await loadFile(files[i]); const d=detectQ(c), low=d.conf<CONF_OK; const p=await finish(c,null,d.quad||insetQuad(c),'enhance',low,null,d.conf);
      pages.push(p); await dbPut(p); ok++; if(low) chk++; }
    catch(e){ bad++; }
  }
  await dbOrder(); autoName(); busy(false); renderGrid(); closeEditor();
  let msg = `已加入 ${ok} 页，共 ${pages.length} 页`; if(chk) msg += `｜${chk} 页标了红点，点开修一下`; if(bad) msg += `｜${bad} 张打不开`;
  toast(msg);
}
async function nextInQueue(){
  const f = queue.shift(); if(!f) return false;
  try{ busy(true,'处理中…'); await core(); await tick(); const c = await loadFile(f); startEdit(c, null, null, 'enhance', -1, false); }
  catch(e){ toast('这张图片打不开，换一张试试'); }
  finally{ busy(false); }
  return true;
}

/* ---------- in-app camera: tap shutter, keep shooting, no confirm per page ---------- */
const vid=$('vid'), ov=$('camOv');
let stream=null, ic=null, liveT=0, jobs=[], working=false, lastShot=0, sess={n:0,low:0,bad:0,start:0}, camOpen=false, wantViewer=-1;
let backCams=[], hq=false;
try{ hq = localStorage.getItem('camHQ')==='1'; }catch(e){}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function stopStream(){ if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; vid.srcObject=null; }
async function startStream(deviceId){
  const v = {width:{ideal:4096}, height:{ideal:3072}};
  if(deviceId) v.deviceId={exact:deviceId}; else v.facingMode={ideal:'environment'};
  stopStream(); stream = await navigator.mediaDevices.getUserMedia({audio:false, video:v});
  vid.srcObject=stream; try{ await vid.play(); }catch(e){}
  const tr=stream.getVideoTracks()[0];
  ic=null; try{ if('ImageCapture' in window) ic=new ImageCapture(tr); }catch(e){}
  // keep refocusing on its own
  try{ const cap=tr.getCapabilities?tr.getCapabilities():{}; if(cap.focusMode&&cap.focusMode.includes('continuous')) await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
  return tr;
}
// phones with several back lenses (main / wide / tele): browsers sometimes pick the tele one → too close, blurry.
// Prefer the main lens ("camera2 0" / "camera 0" on Android); the "换镜头" button cycles and the choice is remembered.
function pickMain(list){
  const m = list.find(d=>/\b(camera2? ?0)\b/i.test(d.label)) || list.find(d=>/back|rear|后/i.test(d.label) && !/tele|长焦|wide|广角|ultra/i.test(d.label));
  return (m||list[0]||{}).deviceId;
}
async function openCam(){
  try{ await startStream(lsGet('camId')||null); }
  catch(e){ try{ await startStream(null); }catch(e2){ toast('打不开相机（可能没给权限），改用手机自带相机'); $('fileCam').click(); return; } }
  try{
    const all=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    backCams = all.filter(d=>!/front|前|user|facetime/i.test(d.label)); if(!backCams.length) backCams=all;
    const cur = stream.getVideoTracks()[0].getSettings().deviceId;
    if(!lsGet('camId') && backCams.length>1){ const want=pickMain(backCams); if(want && want!==cur) await startStream(want); }
  }catch(e){ backCams=[]; }
  $('camLens').hidden = backCams.length<2; $('camHQ').setAttribute('aria-pressed', hq);
  camOpen=true; $('cam').hidden=false; document.body.style.overflow='hidden'; closeEditor(); closeViewer();
  sess={n:0,low:0,bad:0,start:pages.length+jobs.length+(working?1:0)}; $('camN').textContent='0'; $('camLast').hidden=true; $('shutter').disabled=false; camHint();
  core(); live();
}
function camHint(t){ $('camHint').textContent = t || (hq?'高清：按快门后别动，闪了才算拍好':'对准文件，按快门'); }
$('camLens').onclick = async ()=>{
  if(backCams.length<2) return; const cur=stream&&stream.getVideoTracks()[0].getSettings().deviceId;
  const i=backCams.findIndex(d=>d.deviceId===cur), nx=backCams[(i+1)%backCams.length];
  try{ await startStream(nx.deviceId); lsSet('camId',nx.deviceId); toast(`镜头 ${(i+1)%backCams.length+1} / ${backCams.length}，已记住`); }
  catch(e){ toast('这个镜头打不开，换下一个试试'); }
};
$('camHQ').onclick = ()=>{ hq=!hq; lsSet('camHQ',hq?'1':'0'); $('camHQ').setAttribute('aria-pressed',hq); camHint(); toast(hq?'高清：全尺寸照片，按下后稳住约 1 秒':'秒拍：按下那一刻就拍好'); };
// tap the picture to focus there (if the phone supports it)
$('cam').querySelector('.camview').addEventListener('click', async e=>{
  if(e.target.closest('button')||!stream) return;
  const b=vid.getBoundingClientRect(), r=$('focusRing'); r.style.left=(e.clientX-b.left)+'px'; r.style.top=(e.clientY-b.top)+'px'; r.style.opacity=1; setTimeout(()=>r.style.opacity=0,700);
  const tr=stream.getVideoTracks()[0]; let cap={}; try{cap=tr.getCapabilities()}catch(_){}
  const vw=vid.videoWidth, vh=vid.videoHeight, k=Math.min(b.width/vw,b.height/vh), x=((e.clientX-b.left)-(b.width-vw*k)/2)/(vw*k), y=((e.clientY-b.top)-(b.height-vh*k)/2)/(vh*k);
  try{
    const adv={pointsOfInterest:[{x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y))}]};
    if(cap.focusMode&&cap.focusMode.includes('single-shot')) adv.focusMode='single-shot';
    await tr.applyConstraints({advanced:[adv]});
    if(cap.focusMode&&cap.focusMode.includes('continuous')) setTimeout(()=>tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{}),2500);
  }catch(_){}
});
function closeCam(){
  camOpen=false; clearTimeout(liveT); stopStream();
  $('cam').hidden=true; document.body.style.overflow=''; renderGrid();
  if(sess.n){ wantViewer=sess.start; }
  pump();
}
function camSummary(){ if(!sess.n) return; let m=`本次拍了 ${sess.n} 页`; if(sess.low) m+=`，${sess.low} 页带红点`; else m+='，全部找边有把握 👍'; if(sess.bad) m+=`｜${sess.bad} 张处理失败`; toast(m); sess.n=0; sess.low=0; sess.bad=0; }
$('camDone').onclick = closeCam; $('camClose').onclick = closeCam; $('camThumb').onclick = closeCam;
// live outline so you can see what will be cropped
function live(){
  clearTimeout(liveT); if(!camOpen) return;
  liveT=setTimeout(()=>{
    const vw=vid.videoWidth, vh=vid.videoHeight, W=ov.clientWidth, H=ov.clientHeight, dpr=devicePixelRatio||1;
    if(ov.width!==Math.round(W*dpr)){ ov.width=Math.round(W*dpr); ov.height=Math.round(H*dpr); }
    const o=ov.getContext('2d'); o.clearRect(0,0,ov.width,ov.height);
    if(coreOk && vw && !working){
      const s=480/Math.max(vw,vh), c=document.createElement('canvas'); c.width=Math.round(vw*s); c.height=Math.round(vh*s);
      c.getContext('2d').drawImage(vid,0,0,c.width,c.height);
      const r=ScanCore.detect(c);
      if(r && r.quad){
        const k=Math.min(W/vw,H/vh)*dpr, ox=(W*dpr-vw*k)/2, oy=(H*dpr-vh*k)/2, good=r.conf>=CONF_OK;
        o.lineWidth=3*dpr; o.strokeStyle=good?'#2FB98E':'#F2C14E'; o.fillStyle=good?'rgba(47,185,142,.18)':'rgba(242,193,78,.12)';
        o.beginPath(); r.quad.forEach((p,i)=>{const x=ox+p.x/s*k, y=oy+p.y/s*k; i?o.lineTo(x,y):o.moveTo(x,y)}); o.closePath(); o.fill(); o.stroke();
      }
    }
    live();
  }, 280);
}
function flash(){ const f=$('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); try{navigator.vibrate&&navigator.vibrate(25)}catch(e){} }
$('shutter').onclick = async ()=>{
  if(!vid.videoWidth || $('shutter').disabled) return;
  // grab the frame on screen right now → what you see is what you get, no delay
  const vw=vid.videoWidth, vh=vid.videoHeight, frame=document.createElement('canvas'); frame.width=vw; frame.height=vh; frame.getContext('2d').drawImage(vid,0,0);
  let blob=null, fromFrame=true;
  if(hq && ic){
    $('shutter').disabled=true; camHint('别动…');
    try{ blob=await ic.takePhoto(); fromFrame=false; }catch(e){ blob=null; }
    $('shutter').disabled=false; camHint();
  }
  flash();
  const t=document.createElement('canvas'), ts=160/Math.max(vw,vh); t.width=vw*ts; t.height=vh*ts; t.getContext('2d').drawImage(frame,0,0,t.width,t.height);
  $('camLast').src=t.toDataURL('image/jpeg',.6); $('camLast').hidden=false; sess.n++; $('camN').textContent=sess.n; lastShot=Date.now();
  if(!blob) blob=await toBlob(frame,0.93);
  jobs.push({blob, fromFrame, portrait: vh>vw}); updProc(); setTimeout(pump, 1600);
};
function updProc(){
  const n=jobs.length+(working?1:0); $('proc').textContent = n?`· 处理中还剩 ${n} 张`:'';
  if(!camOpen && wantViewer>=0 && n) busy(true,`处理中，还剩 ${n} 张…`, null);
}
async function loadShot(j){
  let c = await loadFile(j.blob);
  // some phones hand back the full-res photo in sensor (landscape) orientation; turn it to match what you saw
  if(!j.fromFrame && j.portrait && c.width>c.height){ const r=document.createElement('canvas'); r.width=c.height; r.height=c.width; const x=r.getContext('2d'); x.translate(r.width,0); x.rotate(Math.PI/2); x.drawImage(c,0,0); c=r; }
  return c;
}
// processes shots one by one; while the camera is open it waits for a pause between shots so the shutter stays snappy
async function pump(){
  if(working) return; working=true;
  while(jobs.length){
    if(camOpen && Date.now()-lastShot<1500){ working=false; updProc(); setTimeout(pump, 1600-(Date.now()-lastShot)); return; }
    const j=jobs.shift(); updProc(); await tick();
    try{ await core(); const c=await loadShot(j); const d=detectQ(c), low=d.conf<CONF_OK;
      const p=await finish(c,null,d.quad||insetQuad(c),'enhance',low,null,d.conf); pages.push(p); await dbPut(p); await dbOrder(); if(low) sess.low++; }
    catch(e){ sess.bad++; }
    autoName(); if(!camOpen) renderGrid();
  }
  working=false; updProc();
  if(!camOpen){ busy(false); renderGrid(); camSummary(); if(wantViewer>=0){ const i=Math.min(wantViewer,pages.length-1); wantViewer=-1; if(i>=0) openViewer(i); } }
}

/* ---------- viewer: swipe through finished pages, edit only when asked ---------- */
let vIdx=0, vUrls=[];
function openViewer(i){
  if(!pages.length) return;
  const tr=$('vTrack'); vUrls.forEach(u=>URL.revokeObjectURL(u)); vUrls=[]; tr.innerHTML='';
  pages.forEach(p=>{ const d=document.createElement('div'); d.className='vpage'; const im=document.createElement('img'); const u=URL.createObjectURL(p.out); vUrls.push(u); im.src=u; im.alt=''; im.loading='lazy'; d.appendChild(im); tr.appendChild(d); });
  $('viewer').hidden=false; document.body.style.overflow='hidden';
  vIdx=Math.max(0,Math.min(i,pages.length-1)); requestAnimationFrame(()=>{ tr.scrollLeft=vIdx*tr.clientWidth; vMeta(); });
}
function closeViewer(){ $('viewer').hidden=true; document.body.style.overflow=''; vUrls.forEach(u=>URL.revokeObjectURL(u)); vUrls=[]; $('vTrack').innerHTML=''; }
function vMeta(){ const p=pages[vIdx]; $('vPos').textContent=`${vIdx+1} / ${pages.length}`; $('vWarn').hidden=!(p&&p.check); const d=$('vDel'); delete d.dataset.sure; d.querySelector('span').textContent='删除'; }
$('vTrack').addEventListener('scroll', ()=>{ const tr=$('vTrack'), i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth)); if(i!==vIdx && i<pages.length){ vIdx=i; vMeta(); } }, {passive:true});
$('vClose').onclick = $('vBack').onclick = ()=>{ closeViewer(); renderGrid(); };
async function vReplace(i,p){ pages[i]=p; await dbPut(p); const im=$('vTrack').children[i]&&$('vTrack').children[i].querySelector('img'); if(im){ const u=URL.createObjectURL(p.out); vUrls.push(u); im.src=u; } vMeta(); renderGrid(); }
$('vEdit').onclick = async ()=>{ const i=vIdx, p=pages[i]; if(!p) return; busy(true,'打开中…'); await tick();
  try{ await core(); const c=await blobToCanvas(p.src); startEdit(c,p.src,p.quad,p.filter,i,false,p.conf); } catch(e){ toast('这一页打不开'); } finally{ busy(false); } };
$('vRot').onclick = async ()=>{ const i=vIdx, p=pages[i]; if(!p) return; busy(true,'旋转中…'); await tick();
  try{ await core(); const c=await blobToCanvas(p.src), r=rot90(c, p.quad); const np=await finish(r.c,null,r.q,p.filter,p.check,p.id,p.conf); await vReplace(i,np); } catch(e){ toast('旋转失败'); } finally{ busy(false); } };
$('vDel').onclick = async ()=>{ const d=$('vDel'), i=vIdx, p=pages[i]; if(!p) return;
  if(!d.dataset.sure){ d.dataset.sure=1; d.querySelector('span').textContent='再按删除'; setTimeout(()=>{ if(d.dataset.sure){ delete d.dataset.sure; d.querySelector('span').textContent='删除'; } },2500); return; }
  pages.splice(i,1); await dbDel(p.id); await dbOrder(); renderGrid();
  if(!pages.length){ closeViewer(); toast('已删除'); return; }
  $('vTrack').children[i].remove(); vIdx=Math.min(i,pages.length-1); $('vTrack').scrollLeft=vIdx*$('vTrack').clientWidth; vMeta(); toast('已删除');
};
function rot90(c, q){ const r=document.createElement('canvas'); r.width=c.height; r.height=c.width; const x=r.getContext('2d'); x.translate(r.width,0); x.rotate(Math.PI/2); x.drawImage(c,0,0);
  const H=c.height, nq=q.map(p=>({x:H-p.y,y:p.x})); return {c:r, q:[nq[3],nq[0],nq[1],nq[2]]}; }

/* ---------- editor ---------- */
function startEdit(c, blob, q, f, idx, sample, conf){
  src = c; srcBlob = blob; filter = f; editingIndex = idx; isSample = !!sample;
  if(q){ quad = q.map(p=>({...p})); srcConf = conf==null?null:conf; } else { const d=detectQ(c); quad = d.quad || insetQuad(c); srcConf = d.conf; }
  $('edConf').textContent = srcConf==null ? '' : `找边把握 ${srcConf}%`;
  $('editor').hidden = false; $('editor').scrollTop = 0; $('edTag').hidden = !isSample;
  $('edTitle').textContent = idx>=0 ? `修改第 ${idx+1} 页` : (queue.length ? `调整边角（还有 ${queue.length} 张）` : '调整边角');
  $('btnSave').textContent = idx>=0 ? '✓ 保存修改' : '✓ 加入文件';
  document.querySelectorAll('.chips .chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.f===filter));
  cv.width = src.width; cv.height = src.height; draw(); schedulePreview();
}
function insetQuad(c){const w=c.width,h=c.height,m=0.04;return[{x:w*m,y:h*m},{x:w*(1-m),y:h*m},{x:w*(1-m),y:h*(1-m)},{x:w*m,y:h*(1-m)}]}

function handleR(){ return Math.max(14, cv.width / (cv.clientWidth||cv.width) * 14); }
let drag = -1;
function draw(){
  ctx.drawImage(src,0,0);
  const r = handleR(), lw = Math.max(2, r/5);
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.rect(0,0,cv.width,cv.height);
  ctx.moveTo(quad[0].x,quad[0].y); for(let i=3;i>=1;i--) ctx.lineTo(quad[i].x,quad[i].y); ctx.closePath(); ctx.fill('evenodd');
  ctx.strokeStyle='#F2C14E'; ctx.lineWidth=lw; ctx.beginPath(); quad.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.stroke();
  quad.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fillStyle = i===drag?'#FFFFFF':'#F2C14E'; ctx.fill(); ctx.lineWidth=lw; ctx.strokeStyle='#14201C'; ctx.stroke(); });
  ctx.restore();
}
function evPt(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}}
cv.addEventListener('pointerdown', e=>{
  const p = evPt(e), R = handleR()*2.6; let best=-1,bd=1e9;

  if(bd<R){ drag=best; cv.setPointerCapture(e.pointerId); showLoupe(); draw(); e.preventDefault(); }
});
cv.addEventListener('pointermove', e=>{ if(drag<0) return; const p=evPt(e);
  quad[drag] = {x:Math.max(0,Math.min(cv.width,p.x)), y:Math.max(0,Math.min(cv.height,p.y))}; draw(); showLoupe(); e.preventDefault(); });

cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

  lc.strokeStyle='#F2C14E'; lc.lineWidth=2; lc.beginPath(); lc.moveTo(S/2,S/2-18); lc.lineTo(S/2,S/2+18); lc.moveTo(S/2-18,S/2); lc.lineTo(S/2+18,S/2); lc.stroke();
}
$('btnRot').onclick = ()=>{ const r=rot90(src,quad); src=r.c; srcBlob=null; quad=r.q; cv.width=src.width; cv.height=src.height; draw(); schedulePreview(); };
$('btnFull').onclick = ()=>{ quad=fullQuad(src); draw(); schedulePreview(); };
$('btnAuto').onclick = ()=>{ const d=detectQ(src); if(d.quad){quad=d.quad; srcConf=d.conf; $('edConf').textContent=`找边把握 ${d.conf}%`; draw(); schedulePreview(); toast(d.conf<CONF_OK?'找到了，但没把握，请看看四个角':'已自动找边，不准的话再拖一下')} else toast('没找到清楚的纸边，请手动拖四个角'); };
document.querySelectorAll('.chips .chip').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; document.querySelectorAll('.chips .chip').forEach(x=>x.setAttribute('aria-pressed', x===b)); schedulePreview(); });
$('btnSave').onclick = async ()=>{
  busy(true,'处理中…'); await tick();
  try{
    if(editingIndex>=0){ const old=pages[editingIndex]; const p=await finish(src,srcBlob,quad,filter,false,old.id,srcConf);
      if(!$('viewer').hidden) await vReplace(editingIndex,p); else { pages[editingIndex]=p; await dbPut(p); } toast(`第 ${editingIndex+1} 页已更新`); }
    else { const p=await finish(src,srcBlob,quad,filter,false,null,srcConf); pages.push(p); await dbPut(p); await dbOrder(); autoName(); toast(`已加入第 ${pages.length} 页`); }
  } catch(e){ toast('保存失败，手机内存可能不够，请先导出一部分'); }
  finally{ busy(false); }
  renderGrid(); if(!(await nextInQueue())) closeEditor();
};
$('btnDiscard').onclick = async ()=>{ if(!(await nextInQueue())) closeEditor(); };
function closeEditor(){ $('editor').hidden=true; src=null; srcBlob=null; isSample=false; }

/* ---------- auto detect: bright paper region vs background ---------- */
function autoDetect(c){
  const W=160, s=W/Math.max(c.width,c.height), w=Math.max(8,Math.round(c.width*s)), h=Math.max(8,Math.round(c.height*s));
  const t=document.createElement('canvas'); t.width=w; t.height=h; const tc=t.getContext('2d'); tc.drawImage(c,0,0,w,h);
  const d=tc.getImageData(0,0,w,h).data, L=new Float32Array(w*h), hist=new Array(256).fill(0);
  for(let i=0;i<w*h;i++){const v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];L[i]=v;hist[v|0]++}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i]; let sB=0,wB=0,best=0,th=128;
  for(let i=0;i<256;i++){wB+=hist[i]; if(!wB)continue; const wF=w*h-wB; if(!wF)break; sB+=i*hist[i];
    const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2; if(v>best){best=v;th=i}}
  const lab=new Uint8Array(w*h); let bestC=null,bestN=0;
  for(let i=0;i<w*h;i++){ if(L[i]<=th||lab[i]) continue; const st=[i]; lab[i]=1; const pts=[];
    while(st.length){const k=st.pop(); pts.push(k); const x=k%w,y=(k/w)|0;
      if(x+1<w&&!lab[k+1]&&L[k+1]>th){lab[k+1]=1;st.push(k+1)} if(x>0&&!lab[k-1]&&L[k-1]>th){lab[k-1]=1;st.push(k-1)}
      if(y+1<h&&!lab[k+w]&&L[k+w]>th){lab[k+w]=1;st.push(k+w)} if(y>0&&!lab[k-w]&&L[k-w]>th){lab[k-w]=1;st.push(k-w)}}
    if(pts.length>bestN){bestN=pts.length;bestC=pts} }
  if(!bestC || bestN < w*h*0.12 || bestN > w*h*0.97) return null;
  let tl,tr,br,bl,a=1e9,b=-1e9,cc=-1e9,dd=1e9;
  for(const k of bestC){const x=k%w,y=(k/w)|0; if(x+y<a){a=x+y;tl={x,y}} if(x+y>b){b=x+y;br={x,y}} if(x-y>cc){cc=x-y;tr={x,y}} if(x-y<dd){dd=x-y;bl={x,y}}}
  return [tl,tr,br,bl].map(p=>({x:Math.min(c.width,(p.x+0.5)/s), y:Math.min(c.height,(p.y+0.5)/s)}));
}

/* ---------- perspective warp ---------- */
function squareToQuad(q){
  const [p0,p1,p2,p3]=q, x0=p0.x,y0=p0.y,x1=p1.x,y1=p1.y,x2=p2.x,y2=p2.y,x3=p3.x,y3=p3.y;
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  let g=0,h=0; if(Math.abs(dx3)>1e-9||Math.abs(dy3)>1e-9){const den=dx1*dy2-dx2*dy1; g=(dx3*dy2-dx2*dy3)/den; h=(dx1*dy3-dx3*dy1)/den;}
  return {a:x1-x0+g*x1,b:x3-x0+h*x3,c:x0,d:y1-y0+g*y1,e:y3-y0+h*y3,f:y0,g,h};
}
function warp(srcC, q){
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  let W=(dist(q[0],q[1])+dist(q[3],q[2]))/2, H=(dist(q[0],q[3])+dist(q[1],q[2]))/2;
  const s=Math.min(1,MAXOUT/Math.max(W,H)); W=Math.max(1,Math.round(W*s)); H=Math.max(1,Math.round(H*s));
  const m=squareToQuad(q), sw=srcC.width, sh=srcC.height;
  const sd=srcC.getContext('2d').getImageData(0,0,sw,sh).data;
  const o=document.createElement('canvas'); o.width=W; o.height=H; const oc=o.getContext('2d'); const od=oc.createImageData(W,H); const D=od.data;
  for(let y=0;y<H;y++){const v=(y+0.5)/H;
    for(let x=0;x<W;x++){const u=(x+0.5)/W, z=m.g*u+m.h*v+1;
      let sx=(m.a*u+m.b*v+m.c)/z-0.5, sy=(m.d*u+m.e*v+m.f)/z-0.5;
      if(sx<0)sx=0; if(sy<0)sy=0; if(sx>sw-1.001)sx=sw-1.001; if(sy>sh-1.001)sy=sh-1.001;
      const ix=sx|0, iy=sy|0, fx=sx-ix, fy=sy-iy, i0=(iy*sw+ix)*4, i1=i0+4, i2=i0+sw*4, i3=i2+4, k=(y*W+x)*4;
      for(let ch=0;ch<3;ch++){D[k+ch]=(sd[i0+ch]*(1-fx)+sd[i1+ch]*fx)*(1-fy)+(sd[i2+ch]*(1-fx)+sd[i3+ch]*fx)*fy}
      D[k+3]=255;}}
  oc.putImageData(od,0,0); return o;
}

/* ---------- filters ---------- */
function applyFilter(c, f){
  if(f==='none') return c;
  const W=c.width,H=c.height, cx=c.getContext('2d'), img=cx.getImageData(0,0,W,H), d=img.data;
  if(f==='gray'){for(let i=0;i<d.length;i+=4){const v=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];d[i]=d[i+1]=d[i+2]=v} cx.putImageData(img,0,0); return c;}
  const bw=Math.max(4,Math.round(W/24)), bh=Math.max(4,Math.round(H/24));
  const sm=document.createElement('canvas'); sm.width=bw; sm.height=bh; const sc=sm.getContext('2d'); sc.imageSmoothingQuality='high'; sc.drawImage(c,0,0,bw,bh);
  let sdat=sc.getImageData(0,0,bw,bh);
  for(let pass=0;pass<2;pass++){const a=sdat.data, b=new Uint8ClampedArray(a);
    for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){let r=0,g=0,bl=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=Math.min(bw-1,Math.max(0,x+dx)),yy=Math.min(bh-1,Math.max(0,y+dy)),k=(yy*bw+xx)*4; if(a[k]>r)r=a[k]; if(a[k+1]>g)g=a[k+1]; if(a[k+2]>bl)bl=a[k+2];}
      const k=(y*bw+x)*4; b[k]=r;b[k+1]=g;b[k+2]=bl;}
    sdat=new ImageData(b,bw,bh);}
  sc.putImageData(sdat,0,0);
  const big=document.createElement('canvas'); big.width=W; big.height=H; const bc=big.getContext('2d'); bc.imageSmoothingQuality='high'; bc.drawImage(sm,0,0,W,H);
  const bg=bc.getImageData(0,0,W,H).data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i]*255/Math.max(40,bg[i]), g=d[i+1]*255/Math.max(40,bg[i+1]), b=d[i+2]*255/Math.max(40,bg[i+2]);
    r=255-(255-r)*1.45; g=255-(255-g)*1.45; b=255-(255-b)*1.45;
    if(f==='bw'){const v=0.299*r+0.587*g+0.114*b; const o=v>200?255:v<150?0:(v-150)*5.1; d[i]=d[i+1]=d[i+2]=o;}
    else{d[i]=r;d[i+1]=g;d[i+2]=b;}
  }
  cx.putImageData(img,0,0); return c;
}
let pv=0;
function schedulePreview(){ const my=++pv; setTimeout(()=>{ if(my!==pv||!src) return;
  if(coreOk){ const r=render(src,quad,filter,900); out.width=r.width; out.height=r.height; out.getContext('2d').drawImage(r,0,0); return; }
  const s=0.5, q=quad.map(p=>({x:p.x*s,y:p.y*s})); const small=document.createElement('canvas'); small.width=Math.round(src.width*s); small.height=Math.round(src.height*s); small.getContext('2d').drawImage(src,0,0,small.width,small.height);
  const r=applyFilter(warp(small,q),filter); out.width=r.width; out.height=r.height; out.getContext('2d').drawImage(r,0,0); },60); }

/* ---------- page grid ---------- */
function renderGrid(){
  const g=$('grid'); g.innerHTML='';
  $('count').textContent = pages.length; $('btnClear').hidden = !pages.length;
  updateExport();
  const nc=pages.filter(p=>p.check).length; $('count').textContent = pages.length + (nc?`（${nc} 页红点待修）`:'');
  if(!pages.length){g.innerHTML='<div class="empty">还没有页面。点下面“拍照”开始扫描，可以连续拍很多张。</div>';return}
  pages.forEach((p,i)=>{
    const el=document.createElement('div'); el.className='page';
    el.innerHTML=`<button class="thumb${p.check?' check':''}" type="button" aria-label="修改第 ${i+1} 页"><img alt="" src="${p.thumb}">${p.check?'<span class="dot" title="找边没把握"></span>':''}</button>
      <div class="pmeta"><span class="pnum">P${i+1}</span><div class="pact"><button class="mini" data-a="l" type="button" aria-label="往前移">‹</button><button class="mini del" data-a="d" type="button" aria-label="删除">✕</button><button class="mini" data-a="r" type="button" aria-label="往后移">›</button></div></div>`;
    el.querySelector('.thumb').onclick=()=>openViewer(i);
    el.querySelectorAll('.mini').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;
      if(a==='d'){ if(b.dataset.sure){ pages.splice(i,1); await dbDel(p.id); await dbOrder(); renderGrid(); }
        else { b.dataset.sure=1; b.textContent='删'; setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='✕'}},2500);} return;}
      const j=a==='l'?i-1:i+1; if(j<0||j>=pages.length)return; [pages[i],pages[j]]=[pages[j],pages[i]]; await dbOrder(); renderGrid();});
    g.appendChild(el);
  });
}
$('btnClear').onclick = async ()=>{
  const b=$('btnClear');
  if(!b.dataset.sure){ b.dataset.sure=1; b.textContent=`确定清空 ${pages.length} 页？再按一次`; setTimeout(()=>{delete b.dataset.sure;b.textContent='清空全部'},3000); return; }
  delete b.dataset.sure; b.textContent='清空全部';
  for(const p of pages) await dbDel(p.id); pages=[]; await dbOrder(); nameEdited=false; autoName(); renderGrid(); toast('已清空');
};

/* ---------- export ---------- */
function baseName(){ return ($('fname').value.trim()||'scan').replace(/[\\/:*?"<>|]/g,'_'); }
function jpgNames(){ const n=pages.length, w=Math.max(2,String(n).length), b=baseName(); return pages.map((_,i)=>`${b}_${String(i+1).padStart(w,'0')}.jpg`); }
function updateExport(){
  const n=pages.length; $('ext').textContent = fmt==='pdf'?'.pdf':'_01.jpg …';
  $('outnote').textContent = fmt==='pdf' ? `${n} 页 → 1 个 PDF（${baseName()}.pdf）` : (n ? `${n} 张图片：${jpgNames()[0]}${n>1?' … '+jpgNames()[n-1]:''}` : '0 张图片');
  $('btnShare').disabled = !n; $('btnSaveOut').disabled = !n;
}
$('fname').addEventListener('input', ()=>{ nameEdited = $('fname').value.trim()!==''; updateExport(); });
document.querySelectorAll('.fmt .chip').forEach(b=>b.onclick=()=>{ fmt=b.dataset.fmt; document.querySelectorAll('.fmt .chip').forEach(x=>x.setAttribute('aria-pressed',x===b)); updateExport(); });

function buildPdf(imgs){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x; parts.push(b); len+=b.length;};
  const obj=(id,...body)=>{offs[id]=len; push(`${id} 0 obj\n`); body.forEach(push); push('\nendobj\n');};
  const n=imgs.length, total=2+3*n, PW=595.28;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${n} >>`);
  imgs.forEach((im,i)=>{
    const pid=3+i*3, PH=(PW*im.h/im.w).toFixed(2), s=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${pid+2} 0 R >> >> /Contents ${pid+1} 0 R >>`);
    obj(pid+1,`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);
    obj(pid+2,`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,'\nendstream');
  });
  const x=len; let xr=`xref\n0 ${total+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=total;i++) xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(xr+`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function buildZip(files){ // stored (no compression), JPEGs are already compressed
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  for(const f of files){ const nm=enc.encode(f.name), crc=crc32(f.bytes), sz=f.bytes.length;
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,f.bytes);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm); off+=30+nm.length+sz; }
  const cs=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});
}
async function makePdf(){
  const imgs=[]; for(let i=0;i<pages.length;i++){ busy(true,`生成 PDF ${i+1} / ${pages.length}`,i/pages.length); await tick();
    const p=pages[i]; imgs.push({bytes:new Uint8Array(await p.out.arrayBuffer()),w:p.w,h:p.h}); }
  return new File([buildPdf(imgs)], baseName()+'.pdf', {type:'application/pdf'});
}
function makeJpgs(){ const names=jpgNames(); return pages.map((p,i)=>new File([p.out], names[i], {type:'image/jpeg'})); }

// Share sheet (WhatsApp etc.) — works on Android Chrome / installed app over https; not inside the Claude preview
function canShareFiles(){ try{ return !inClaude && !!navigator.canShare && navigator.canShare({files:[new File([new Uint8Array([1])],'t.jpg',{type:'image/jpeg'})]}); }catch(e){ return false; } }
$('btnShare').hidden = !canShareFiles();
$('btnShare').onclick = async ()=>{
  if(!pages.length) return;
  let files;
  try{ files = fmt==='pdf' ? [await makePdf()] : makeJpgs(); } catch(e){ busy(false); toast('生成文件失败，页面太多可以分两次'); return; }
  busy(false);
  try{
    if(!navigator.canShare({files})){ toast('文件太多或太大，手机不让一次分享，请分两次或改用 PDF'); return; }
    await navigator.share({files, title: baseName()});
  }catch(e){ if(e && e.name!=='AbortError') toast('分享没成功：'+(e.message||'请再试一次')); }
};
$('btnSaveOut').onclick = async ()=>{
  if(!pages.length) return;
  try{
    if(inClaude){
      if(!downloads){ try{ downloads = await window.claude.use('downloads'); }catch(e){} }
      if(!downloads){ busy(false); toast('这里不能保存文件，请用 Netlify 上的版本'); return; }
      let name, data;
      if(fmt==='pdf'){ const f=await makePdf(); name=f.name; data=f; }
      else { busy(true,'打包 JPEG…'); await tick(); const fs=makeJpgs(); const items=[]; for(const f of fs) items.push({name:f.name,bytes:new Uint8Array(await f.arrayBuffer())}); data=buildZip(items); name=baseName()+'_jpeg.zip'; }
      busy(false);
      try{ await downloads.save({filename:name,data}); toast(`已保存 ${name}`); }
      catch(e){ toast(e?.code==='declined'?'已取消保存':'这里存不了文件'); }
      return;
    }
    const files = fmt==='pdf' ? [await makePdf()] : makeJpgs();
    for(let i=0;i<files.length;i++){
      busy(true, files.length>1?`保存 ${i+1} / ${files.length}`:'保存中…', files.length>1?i/files.length:null);
      const a=document.createElement('a'); a.href=URL.createObjectURL(files[i]); a.download=files[i].name; document.body.appendChild(a); a.click(); a.remove();
      const u=a.href; setTimeout(()=>URL.revokeObjectURL(u),8000); await new Promise(r=>setTimeout(r,files.length>1?400:50));
    }
    busy(false); toast(files.length>1?`已保存 ${files.length} 张图片到“下载”文件夹`:`已保存 ${files[0].name}`);
  }catch(e){ busy(false); toast('保存失败，页面太多可以分两次'); }
};

/* ---------- boot ---------- */
closeEditor(); renderGrid();
(async()=>{
  idb = await openDb();
  const saved = await dbLoad();
  if(saved.length){ pages = saved; renderGrid(); toast(`已恢复上次的 ${saved.length} 页`); }
})();
})();
